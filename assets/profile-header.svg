<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Cabeçalho do perfil de Roger Wilike">
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f7f3ea; }
      .card { fill: #ffffff; stroke: none; rx: 12; }
      .name { font: 600 28px/1.1 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 14px/1.3 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #333; }
      .badge { image-rendering: -webkit-optimize-contrast; }
    ]]></style>
  </defs>

  <!-- fundo bege -->
  <rect class="bg" x="0" y="0" width="900" height="260" rx="0" />

  <!-- área do cartão branco (sutil) -->
  <rect x="16" y="16" width="868" height="228" rx="12" fill="#ffffff" opacity="0.9" />

  <!-- imagem do perfil à esquerda -->
  <clipPath id="imgClip"><rect x="28" y="28" width="204" height="204" rx="10" ry="10"/></clipPath>
  <image clip-path="url(#imgClip)" x="28" y="28" width="204" height="204"
         href="https://blog.faradars.org/wp-content/uploads/2024/05/A-computer-screen-with-lines-of-code-on-it-representing-statistics-techniques-for-machine-learning.jpg"
         preserveAspectRatio="xMidYMid slice" />

  <!-- Texto à direita da imagem -->
  <g transform="translate(248,56)">
    <text class="name">Roger Wilike</text>
    <text class="subtitle" x="0" y="36">Desenvolvedor full‑stack — aplicações acessíveis, boas práticas e aprendizado contínuo</text>

    <!-- badges de contato como imagens clicáveis -->
    <g transform="translate(0,84)">
      <a href="https://github.com/rogerwilike" target="_blank">
        <image class="badge" href="https://img.shields.io/badge/-GitHub-181717?style=for-the-badge&logo=github&logoColor=white" x="0" y="0" width="150" height="34" />
      </a>
      <a href="https://www.linkedin.com/in/rogerwilike" target="_blank">
        <image class="badge" href="https://img.shields.io/badge/-LinkedIn-%230077B5?style=for-the-badge&logo=linkedin&logoColor=white" x="162" y="0" width="170" height="34" />
      </a>
      <a href="mailto:rogerwilik@gmail.com">
        <image class="badge" href="https://img.shields.io/badge/-Email-D14836?style=for-the-badge&logo=gmail&logoColor=white" x="344" y="0" width="130" height="34" />
      </a>
    </g>

  </g>

</svg>
